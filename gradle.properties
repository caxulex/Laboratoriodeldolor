org.gradle.java.home=C:/Program Files/Eclipse Adoptium/jdk-17.0.16.8-hotspot

# Increase Gradle daemon heap to avoid D8 OutOfMemoryError during dexing.
# Adjust these values if your machine has less RAM (e.g. -Xmx2048m).
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
# Kotlin daemon extra memory for compilation workers
kotlin.daemon.jvmargs=-Xmx1024m
# Optional: disable the daemon performance thrashing log spam once memory is tuned
org.gradle.daemon.performance.disable-logging=true

# Ensure AndroidX migration is enabled so AGP can handle AndroidX artifacts
android.useAndroidX=true
# Enable Jetifier to rewrite older support-library artifacts at build time if present
android.enableJetifier=false
