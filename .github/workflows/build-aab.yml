name: Build AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode and write keystore (optional)
        if: secrets.BASE64_KEYSTORE
        run: |
          echo "$BASE64_KEYSTORE" | base64 --decode > keystore/release.keystore

      - name: Create key.properties from secrets (optional)
        run: |
          if [ -n "${{ secrets.KEYSTORE_PASSWORD }}" ]; then
            cat > key.properties <<EOF
storeFile=keystore/release.keystore
storePassword=${{ secrets.KEYSTORE_PASSWORD }}
keyAlias=${{ secrets.KEY_ALIAS }}
keyPassword=${{ secrets.KEY_PASSWORD }}
EOF
          fi

      - name: Grant executable permission to gradlew
        run: chmod +x gradlew

      - name: Build bundle
        run: ./gradlew :app:bundleRelease --no-daemon

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-bundle
          path: app/build/outputs/bundle/release/*.aab

  # Optional: upload to Google Play internal track using a service account
  # To enable, add the following secrets to your repository settings:
  # - PLAY_SERVICE_ACCOUNT_JSON : the JSON contents of the service account (base64 or raw)
  # - PLAY_PACKAGE_NAME : com.example.laboratoriodeldolor
