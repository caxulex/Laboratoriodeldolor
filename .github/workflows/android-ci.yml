name: Android CI

on:
  push:
    branches:
      - main
      - master
      - 'checkpoint/**'
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v2

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}

      - name: Build (assembleDebug)
        run: ./gradlew :app:assembleDebug --no-daemon --warning-mode all

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --warning-mode all

      - name: Run lint
        run: ./gradlew :app:lint --no-daemon --warning-mode all
