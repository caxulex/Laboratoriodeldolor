name: Upload Keystore (manual)

on:
  workflow_dispatch:
    inputs:
      keystore_path:
        description: 'Path to keystore in repository workspace (relative)'
        required: true
        default: 'keystore/release.keystore'

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Upload keystore as artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-keystore
          path: ${{ github.event.inputs.keystore_path }}

    # NOTE: This workflow only makes the keystore available as a GitHub Actions artifact
    # for later jobs in the same organization/workflow run. Use caution: artifacts are
    # accessible to repository maintainers or to those with artifact access. Do NOT
    # expose keystore contents publicly.
